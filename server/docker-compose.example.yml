version: '3.8'

services:
  ipa-harbor:
    build: .
    ports:
      - "3080:3080"
      - "3443:3443"
    environment:
      - NODE_ENV=production
      # Generate KEYCHAIN_PASSPHRASE in your terminal:
      # openssl rand -base64 15 | tr -dc 'A-Za-z0-9' | head -c10; echo
      # Required: replace keychain_passphrase_here with a random string. The app will not start without it.
      # If this value is leaked, your Keychain can be unlocked and Apple ID access may be exposed.
      - KEYCHAIN_PASSPHRASE=keychain_passphrase_here
      # Init PIN for setup and admin password reset
      # openssl rand -base64 24 | tr -dc '0-9' | head -c8; echo
      - ADMIN_INIT_PIN=init_pin_here
      # Optional: enable /recover
      # - ADMIN_RECOVERY_ENABLED=true
      # Use when running Linux Docker without a GUI keyring
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent
      # HTTP port
      - PORT=3080
      # Built-in HTTPS port (requires server.crt/server.key in certs/).
      # Optional: remove this and the 3443 port mapping if you use HTTP only or reverse-proxy HTTP.
      - HTTPS_PORT=3443
      # Auto-generate LAN HTTPS certs (CA + server cert with /24 SAN). Requires openssl in container.
      # - ENABLE_AUTO_CERT=true
      # Host IP for /24 subnet SAN (e.g. 192.168.1.101). Persisted to data/.ipatool/LAN_IP
      # - LAN_IP=192.168.1.101
      # Local hostname for DNS + WebAuthn (e.g. ipa-harbor.local). Default: localhost, usually can get from scutil --get LocalHostName, + .local suffix as hostname
      # - LAN_HOSTNAME=ipa-harbor.local
      # Browser access whitelist (CORS). Required when accessing via domain instead of localhost.
      - ALLOWED_DOMAINS=your-domain.com,another-domain.com
      # Public deployment: false. Local/LAN only: true (allows 192.168.x.x, 10.x.x.x, 172.16-31.x.x)
      - ALLOW_LAN_ACCESS=false
      # Optional: set to true for verbose logs (download debug, request logs, etc.)
      # - ENABLE_MORE_LOGS=true
      # Optional: override default concurrent downloads (default: 2)
      # - MAX_CONCURRENT_DOWNLOADS=2
      # Optional: change admin JWT secret on production deployments (default is insecure)
      # - JWT_SECRET=your-random-secret
      # Optional: OTA/download ticket TTL in ms (defaults: manifest 3m, ipa 1d)
      # - MANIFEST_TICKET_TTL_MS=180000
      # - PACKAGE_TICKET_TTL_MS=86400000
      # Set to 1 when behind nginx, Cloudflare, or other reverse proxy so rate limiting uses the real client IP; omit for direct access
      # - TRUST_PROXY=1
      # Passkey config (optional)
      # RP ID must not include port, e.g. example.com
      # - WEBAUTHN_RP_ID=example.com
      # Allowed Origins, comma-separated; include the port when not on the default
      # - WEBAUTHN_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3030,https://example.com,https://example.com:8443
      # Optional: challenge TTL in ms (default 5m) and cleanup interval in minutes (default 5)
      # - WEBAUTHN_CHALLENGE_TTL_MS=300000
      # - WEBAUTHN_CHALLENGE_CLEANUP_INTERVAL_MINUTES=5
    volumes:
      # Persist data: IPA files, partial downloads (tmp), admin database, and ipatool config ($HOME/.ipatool)
      - ./data:/app/data
      # Optional: manual TLS certs (when ENABLE_AUTO_CERT is not used)
      # - ./certs:/app/certs
    restart: unless-stopped
